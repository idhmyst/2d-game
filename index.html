<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2D Retro Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: 'Outfit', sans-serif;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #090d16;
      outline: none;
    }
    #game-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      cursor: crosshair;
    }
    canvas {
      display: block;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
    }
    /* Fullscreen button overlay */
    #btn-fs {
      position: absolute;
      top: 14px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
      font-size: 22px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: all 0.15s ease;
    }
    #btn-fs:hover {
      background: #0284c7;
      color: #ffffff;
      transform: scale(1.06);
    }
    #btn-fs:active {
      transform: scale(0.94);
    }
    /* Touch / Click Controls Overlay */
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 1066px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 28px;
      pointer-events: none;
      z-index: 999;
    }
    .dpad {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .action-pad {
      pointer-events: auto;
    }
    .touch-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 2.5px solid #38bdf8;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s, background 0.08s, border-color 0.08s;
      outline: none;
      touch-action: none;
    }
    .touch-btn:active, .touch-btn.active {
      transform: scale(0.88);
      background: #0284c7;
      border-color: #ffffff;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.7);
    }
    /* Controls hint bar */
    #controls-hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(148, 163, 184, 0.85);
      background: rgba(15, 23, 42, 0.75);
      padding: 4px 16px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 998;
      white-space: nowrap;
      letter-spacing: 0.5px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    @media (max-width: 768px) {
      #controls-hint {
        display: none;
      }
      .touch-btn {
        width: 58px;
        height: 58px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper" tabindex="0">
    <div id="game-container" tabindex="0"></div>
    <button id="btn-fs" title="Layar Penuh (F)">⛶</button>
    <div id="touch-controls">
      <div class="dpad">
        <button class="touch-btn" id="btn-left" title="Kiri (A / ◀)">◀</button>
        <button class="touch-btn" id="btn-right" title="Kanan (D / ▶)">▶</button>
      </div>
      <div class="action-pad">
        <button class="touch-btn" id="btn-jump" title="Lompat (W / Space / ▲)">▲</button>
      </div>
    </div>
    <div id="controls-hint">⌨️ A / D / ◀ ▶ Jalan  •  W / Space / ▲ Lompat  •  Klik Layar untuk Gerak  •  F Layar Penuh</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
